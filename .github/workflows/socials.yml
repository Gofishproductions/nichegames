name: Nichegames parallel socials
run-name: Social enrichment ${{ github.run_id }}

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'

concurrency:
  group: nichegames-parallel-socials
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  socials:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund --omit=dev
      - name: Social enrichment shard ${{ matrix.shard }}
        run: node scanner/bulk-worker.mjs
        env:
          BULK_MODE: socials
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '8'
          WORKER_CONCURRENCY: '4'
          BULK_LIMIT: '10000'
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
